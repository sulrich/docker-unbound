name: build docker images

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: docker-unbound

jobs:
  build-and-test:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: build docker image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: run docker image tests
        run: docker run --rm ${{ env.IMAGE_NAME }}:test /test.sh

      - name: build summary
        run: |
          echo "## docker build summary (${{ matrix.platform }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "built and tested on **${{ matrix.platform }}** (native runner: ${{ matrix.runs-on }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "note: test build only - no images pushed to registry" >> $GITHUB_STEP_SUMMARY
